<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="logout"><title>logout</title><style>@font-face{font-family:jb;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:jbb;src:url(data:font/woff2;base64,) format('woff2')}.vt{font-family:vt,ui-monospace,monospace}.jb{font-family:jb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.jbb{font-family:jbb,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pop{to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(var(--h))}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}97%{opacity:.9}98%{opacity:1}}
.blink{animation:blink 1.06s steps(1) infinite}
.later{opacity:0;animation:pop .01s linear forwards}
.up{opacity:0;animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) forwards}
</style>
<defs>
